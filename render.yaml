services:
  - type: web
    name: interlink-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://tbjeonntfbezvtlyhuvi.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: OPEN_ER_API_BASE_URL
        value: https://open.er-api.com/v6/latest/USD
      - key: BINANCE_API_BASE_URL
        value: https://api.binance.com/api/v3
      - key: BINANCE_WS_URL
        value: wss://stream.binance.com:9443/ws
      - key: TETHER_NETWORK
        value: Sepolia
      - key: TETHER_RPC_URL
        value: https://rpc.sepolia.org
      - key: TETHER_USDT_CONTRACT_ADDRESS
        value: "0x7169D38820dfd117C3FA1f22a697dBA58d90BA06"
      - key: QUOTE_SIGNING_SECRET
        sync: false
      - key: ADMIN_EMAILS
        value: admin@assetbridge.africa,security@assetbridge.africa,malulekelucas04@gmail.com
      - key: ENABLE_DEV_TEST_ACCOUNT
        value: "true"
      - key: OTP_PROVIDER_API_KEY_SECRETE
        sync: false
      - key: OTP_PROVIDER_API_KEY_SID
        sync: false
